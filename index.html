<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Timetable — Erica, Erinn & Erich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #101019;
    --bg-2: #14141f;
    --panel: #191927;
    --panel-2: #1e1e2e;
    --hairline: rgba(255,255,255,0.075);
    --hairline-strong: rgba(255,255,255,0.14);
    --text: #F3F2F8;
    --text-muted: #9694a6;
    --text-faint: #5c5a6c;
    --rail-w: 52px;

    --erica: #5C8DFF;
    --erica-soft: rgba(92,141,255,0.16);
    --erica-border: rgba(92,141,255,0.5);

    --erinn: #A374FF;
    --erinn-soft: rgba(163,116,255,0.16);
    --erinn-border: rgba(163,116,255,0.5);

    --erich: #FF6FA0;
    --erich-soft: rgba(255,111,160,0.16);
    --erich-border: rgba(255,111,160,0.5);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100vw; height:100vh; overflow:hidden;
    background: radial-gradient(ellipse at 20% -10%, #191b2c 0%, var(--bg) 55%);
    color: var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
    padding: clamp(14px, 2vh, 28px) clamp(16px, 2.4vw, 40px);
  }

  /* ---------- HEADER ---------- */
  .app-header{
    flex: 0 0 auto;
    min-height: 10vh;
    max-height: 15vh;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 24px;
    padding-bottom: clamp(10px, 1.6vh, 20px);
    border-bottom: 1px solid var(--hairline);
  }

  .now-playing{
    display:flex;
    flex-direction:column;
    gap: 5px;
    min-width: 0;
    flex: 1 1 340px;
    max-width: 560px;
  }
  .np-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(9px, 0.75vw, 11px);
    letter-spacing: 0.22em;
    color: var(--text-faint);
    text-transform: uppercase;
  }
  .np-content{
    display:flex; flex-direction:column; gap:6px;
    transition: opacity .25s ease, transform .25s ease;
    opacity:1; transform: translateY(0);
    min-width:0;
  }
  .np-content.switching{ opacity:0; transform: translateY(6px); }

  .np-title-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:14px; min-width:0;
  }
  .np-subject{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(17px, 1.9vw, 26px);
    letter-spacing: -0.01em;
    color: var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .np-who{
    display:flex; align-items:center; gap:6px;
    font-size: clamp(11px, 0.85vw, 13px);
    font-weight:600;
    white-space:nowrap; flex-shrink:0;
  }
  .np-who .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .np-who[data-student="Erica"]{ color: var(--erica); } .np-who[data-student="Erica"] .dot{ background: var(--erica); }
  .np-who[data-student="Erinn"]{ color: var(--erinn); } .np-who[data-student="Erinn"] .dot{ background: var(--erinn); }
  .np-who[data-student="Erich"]{ color: var(--erich); } .np-who[data-student="Erich"] .dot{ background: var(--erich); }

  .np-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(9.5px, 0.7vw, 11.5px);
    color: var(--text-muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .np-progress-row{ display:flex; flex-direction:column; gap:4px; }
  .np-track{
    position:relative;
    height:3px; border-radius:2px;
    background: var(--hairline-strong);
    overflow:hidden;
  }
  .np-fill{
    position:absolute; left:0; top:0; bottom:0;
    border-radius:2px;
    background: linear-gradient(to right, var(--np-color, var(--erica)), var(--np-color, var(--erica)));
    transition: width 1s linear;
  }
  .np-fill::after{
    content:""; position:absolute; right:-3px; top:50%; translate: 0 -50%;
    width:7px; height:7px; border-radius:50%;
    background: var(--np-color, var(--erica));
    box-shadow: 0 0 6px 1px color-mix(in srgb, var(--np-color, var(--erica)) 70%, transparent);
  }
  .np-timing-row{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(9px, 0.68vw, 11px);
    color: var(--text-faint);
  }

  /* multi-class compact list */
  .np-multi-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-size: clamp(11px, 0.9vw, 14px);
    min-width:0;
  }
  .np-multi-row .np-multi-subject{
    font-family:'Inter', sans-serif; font-weight:600; color: var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  }

  .legend{
    display:flex;
    gap: clamp(6px, 1vw, 14px);
    flex-wrap: wrap;
  }
  .legend-item{
    display:flex; align-items:center; gap:8px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    padding: 7px 14px 7px 10px;
    border-radius: 999px;
    cursor:pointer;
    color: var(--text-muted);
    font-size: clamp(11px, 0.85vw, 13px);
    font-weight: 500;
    transition: all .2s ease;
  }
  .legend-item .dot{
    width:9px; height:9px; border-radius:50%;
    box-shadow: 0 0 0 3px transparent;
    transition: box-shadow .2s ease;
  }
  .legend-item[data-student="Erica"] .dot{ background: var(--erica); }
  .legend-item[data-student="Erinn"] .dot{ background: var(--erinn); }
  .legend-item[data-student="Erich"] .dot{ background: var(--erich); }
  .legend-item.active{ color: var(--text); border-color: var(--hairline-strong); background: var(--panel-2); }
  .legend-item.active[data-student="Erica"] .dot{ box-shadow: 0 0 0 3px var(--erica-soft); }
  .legend-item.active[data-student="Erinn"] .dot{ box-shadow: 0 0 0 3px var(--erinn-soft); }
  .legend-item.active[data-student="Erich"] .dot{ box-shadow: 0 0 0 3px var(--erich-soft); }
  .legend-item.dimmed{ opacity: 0.35; }

  .flip-btn{
    display:flex; align-items:center; gap:7px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    padding: 7px 13px;
    border-radius: 999px;
    cursor:pointer;
    color: var(--text-muted);
    font-family:'Inter', sans-serif;
    font-size: clamp(11px, 0.85vw, 13px);
    font-weight: 500;
    transition: all .2s ease;
    flex-shrink:0;
  }
  .flip-btn:hover{ color: var(--text); border-color: var(--hairline-strong); background: var(--panel-2); }
  .flip-btn svg{ flex-shrink:0; transition: transform .3s ease; }
  .flip-btn.rotated svg{ transform: rotate(180deg); }

  .clock{
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(11px, 0.9vw, 14px);
    color: var(--text-faint);
    text-align:right;
    white-space:nowrap;
  }
  .clock span{ color: var(--text-muted); }

  /* ---------- GRID ---------- */
  .grid-wrap{
    flex: 1 1 auto;
    min-height: 0;
    display:flex; flex-direction:column;
    padding-top: clamp(10px, 1.6vh, 18px);
  }

  /* crossfade used only when orientation itself changes */
  #axisTop, .grid-body{
    transition: opacity .22s ease, transform .22s ease;
    opacity: 1; transform: translateY(0);
  }
  .grid-wrap.switching #axisTop,
  .grid-wrap.switching .grid-body{
    opacity: 0; transform: translateY(6px);
  }

  /* ===== shared axis label styles ===== */
  #axisTop{
    display:flex;
    flex: 0 0 auto;
    margin-bottom: 6px;
    position:relative;
  }
  /* normal orientation: axisTop = day-name header row */
  .axis-top-day{
    flex:1;
    text-align:center;
    font-weight:600;
    font-size: clamp(10px, 0.85vw, 13px);
    letter-spacing: 0.08em;
    color: var(--text-muted);
    padding-bottom: 8px;
    border-bottom: 1px solid var(--hairline);
    text-transform: uppercase;
  }
  .axis-top-day.is-today{ color: var(--text); }
  .today-mark{
    display:inline-block;
    width:5px; height:5px; border-radius:50%;
    background: #ffd166;
    margin-left:6px;
    vertical-align:middle;
    box-shadow: 0 0 6px 1px rgba(255,209,102,0.7);
  }
  /* rotated orientation: axisTop = hourly time header, absolutely positioned ticks */
  #axisTop.rotated{
    height: 28px;
    border-bottom: 1px solid var(--hairline);
  }
  .axis-top-hour{
    position:absolute;
    top:0;
    transform: translateX(-50%);
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(9px, 0.7vw, 11px);
    color: var(--text-faint);
  }

  .grid-body{
    flex: 1 1 auto;
    min-height:0;
    display:flex;
    position:relative;
  }

  /* ===== axis-side (rail) — signature element, shared between orientations ===== */
  #axisSide{
    flex: 0 0 var(--rail-w);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .rail-thread{
    position:absolute;
    left: 24px; top:0; bottom:0;
    width:1px;
    background: linear-gradient(to bottom, transparent, var(--hairline-strong) 8%, var(--hairline-strong) 92%, transparent);
  }
  .rail-thread.horizontal{
    left:0; right:0; top:14px; bottom:auto; width:auto; height:1px;
    background: linear-gradient(to right, transparent, var(--hairline-strong) 8%, var(--hairline-strong) 92%, transparent);
  }
  /* normal: absolutely-positioned hour ticks down the rail */
  .rail-tick-time{
    position:absolute;
    left:0; width:100%;
    transform: translateY(-50%);
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(9px, 0.7vw, 11px);
    color: var(--text-faint);
    text-align:left;
  }
  .rail-tick-time .node{
    display:inline-block;
    width:5px; height:5px; border-radius:50%;
    background: var(--hairline-strong);
    margin-right:6px;
    position:relative; top:-1px;
  }
  /* rotated: day labels stacked as equal flex rows */
  .rail-day{
    flex:1;
    display:flex; align-items:center;
    font-weight:600;
    font-size: clamp(10px, 0.85vw, 13px);
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
    border-bottom: 1px solid var(--hairline);
  }
  .rail-day.is-today{ color: var(--text); }
  .rail-day:last-child{ border-bottom:none; }

  /* ===== tracks (days x7, normal=row of columns / rotated=column of rows) ===== */
  #tracks{
    flex:1;
    display:flex;
    position:relative;
  }
  #tracks.rotated{ flex-direction:column; }

  .track{
    flex:1;
    position:relative;
    border-left: 1px solid var(--hairline);
    overflow:hidden; /* hard clip — a day's boundary is immutable; cards can never bleed into a neighboring day */
  }
  #tracks:not(.rotated) .track{
    background-image: repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.032) 0, rgba(255,255,255,0.032) 1px,
      transparent 1px, transparent calc(100% / 13)
    );
  }
  #tracks:not(.rotated) .track:last-child{ border-right: 1px solid var(--hairline); }

  #tracks.rotated .track{
    border-left:none;
    border-top: 1px solid var(--hairline);
    background-image: repeating-linear-gradient(
      to right, rgba(255,255,255,0.032) 0, rgba(255,255,255,0.032) 1px,
      transparent 1px, transparent calc(100% / 13)
    );
  }
  #tracks.rotated .track:last-child{ border-bottom: 1px solid var(--hairline); }

  .track.is-today{ background-color: rgba(255,255,255,0.018); }

  .now-line{
    position:absolute;
    z-index:5;
    opacity:0.85;
  }
  .now-line.vertical{
    left:0; right:0; top:0; height:0;
    border-top: 1.5px dashed #ffd166;
  }
  .now-line.vertical::before{
    content:""; position:absolute; left:-4px; top:-4px;
    width:8px; height:8px; border-radius:50%; background:#ffd166;
    box-shadow: 0 0 8px 2px rgba(255,209,102,0.8);
    animation: pulse 2.2s ease-in-out infinite;
  }
  .now-line.horizontal{
    top:0; bottom:0; left:0; width:0;
    border-left: 1.5px dashed #ffd166;
  }
  .now-line.horizontal::before{
    content:""; position:absolute; top:-4px; left:-4px;
    width:8px; height:8px; border-radius:50%; background:#ffd166;
    box-shadow: 0 0 8px 2px rgba(255,209,102,0.8);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.4); opacity:0.6; }
  }

  /* ---------- CARDS ---------- */
  .event-card{
    position:absolute;
    border-radius: 10px;
    padding: 8px 9px 7px;
    overflow:hidden; /* safety net — box is sized to fit content, this just guarantees containment */
    cursor:default;
    border: 1px solid;
    backdrop-filter: blur(2px);
    transition: transform .18s ease, box-shadow .18s ease, z-index 0s,
                left .38s cubic-bezier(.4,0,.2,1), width .38s cubic-bezier(.4,0,.2,1),
                top .38s cubic-bezier(.4,0,.2,1), height .38s cubic-bezier(.4,0,.2,1),
                min-height .38s cubic-bezier(.4,0,.2,1), min-width .38s cubic-bezier(.4,0,.2,1),
                opacity .3s ease;
    display:flex;
    flex-direction:column;
    gap:2px;
    height:auto; /* grows to fit wrapped subject title */
    container-type: inline-size;
    container-name: card;
  }

  /* progressively shrink type + padding as a card's own width shrinks
     (e.g. multiple overlapping classes sharing a track) */
  @container card (max-width: 110px){
    .event-card{ padding: 6px 7px 6px; gap:1px; }
    .event-card .subject{ font-size: 9.5px; line-height:1.18; }
    .event-card .code, .event-card .student, .event-card .time-range{ font-size: 7.8px; }
  }
  @container card (max-width: 78px){
    .event-card{ padding: 5px 6px 5px; }
    .event-card .subject{ font-size: 8.6px; line-height:1.14; }
  }
  .event-card[data-student="Erica"]{ background: var(--erica-soft); border-color: var(--erica-border); }
  .event-card[data-student="Erinn"]{ background: var(--erinn-soft); border-color: var(--erinn-border); }
  .event-card[data-student="Erich"]{ background: var(--erich-soft); border-color: var(--erich-border); }

  .event-card .subject{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size: clamp(10px, 0.78vw, 12.5px);
    line-height:1.28;
    color: var(--text);
    white-space:normal;
    overflow-wrap:break-word;
    word-break:normal;
    hyphens:none;
    text-wrap:pretty; /* avoids single-word orphan lines where supported */
    flex-shrink:0;
  }
  .event-card .meta-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:6px;
    flex-shrink:0;
  }
  .event-card .code{
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(8.5px, 0.62vw, 10.5px);
    color: var(--text-muted);
    white-space:normal;
    overflow-wrap:break-word;
    line-height:1.2;
    max-width: 62%;
  }
  .event-card .student{
    font-size: clamp(8.5px, 0.62vw, 10.5px);
    font-weight:600;
    color: var(--text-muted);
    white-space:nowrap;
    flex-shrink:0;
  }
  .event-card[data-student="Erica"] .student{ color: var(--erica); }
  .event-card[data-student="Erinn"] .student{ color: var(--erinn); }
  .event-card[data-student="Erich"] .student{ color: var(--erich); }

  .event-card .time-range{
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(8px, 0.58vw, 10px);
    color: var(--text-faint);
    margin-top: auto;
    white-space:normal;
    overflow-wrap:break-word;
    line-height:1.25;
    flex-shrink:0;
  }

  .event-card:hover{
    transform: scale(1.035);
    z-index: 50 !important;
    box-shadow: 0 10px 30px -6px rgba(0,0,0,0.55), 0 0 0 1px var(--hairline-strong);
  }

  .event-card.dimmed{
    opacity: 0.12;
    pointer-events:none;
  }

  /* small screens */
  @media (max-width: 720px){
    .clock{ display:none; }
    .legend-item span.label{ display:none; }
    .legend-item{ padding:7px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="now-playing" id="nowPlaying">
      <span class="np-label" id="npLabel">NOW</span>
      <div class="np-content" id="npContent"><!-- populated by JS --></div>
    </div>
    <div class="legend" id="legend">
      <button class="legend-item active" data-student="Erica"><span class="dot"></span><span class="label">Erica</span></button>
      <button class="legend-item active" data-student="Erinn"><span class="dot"></span><span class="label">Erinn</span></button>
      <button class="legend-item active" data-student="Erich"><span class="dot"></span><span class="label">Erich</span></button>
    </div>
    <button class="flip-btn" id="flipBtn" type="button" aria-label="Flip timetable axis">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13M7 7l4-4M7 7l4 4M17 17H4M17 17l-4-4M17 17l-4 4"/></svg>
      <span id="flipBtnLabel">Days → Time</span>
    </button>
    <div class="clock" id="clock"></div>
  </header>

  <div class="grid-wrap" id="gridWrap">
    <div id="axisTop"></div>
    <div class="grid-body">
      <div id="axisSide"></div>
      <div id="tracks"></div>
    </div>
  </div>
</div>

<script>
  // ---------- CONFIG ----------
  const DAY_START = 8 * 60;   // 8:00 AM in minutes
  const DAY_END   = 21 * 60;  // 9:00 PM in minutes
  const TOTAL_MIN = DAY_END - DAY_START;
  const DAYS = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
  const JS_DAY_INDEX = {SUN:0, MON:1, TUE:2, WED:3, THU:4, FRI:5, SAT:6};
  const GAP = 4;
  const MIN_CARD_W = 90;   // px floor for a card's short axis in "normal" mode
  const MIN_CARD_H = 64;   // px floor for a card's cross axis
  const ROTATE_THRESHOLD = 108; // px — below this, a normal-mode card is judged too narrow to read

  function t(h, m){ return h*60+m; }

  // ---------- DATA ----------
  const EVENTS = [
    // MON
    { day:"MON", start:t(12,0), end:t(14,0), student:"Erich", subject:"Physical Activity Towards Health and Fitness 1", code:"PATHFIT 1" },
    { day:"MON", start:t(13,30), end:t(16,30), student:"Erinn", subject:"Financial Accounting and Reporting", code:"ACCO 101" },
    { day:"MON", start:t(16,30), end:t(21,0), student:"Erich", subject:"Psychological Statistics", code:"PSYC 104" },
    { day:"MON", start:t(18,0), end:t(21,0), student:"Erinn", subject:"Law on Obligations and Contracts", code:"LAW 101" },
    // TUE
    { day:"TUE", start:t(8,0), end:t(12,0), student:"Erica", subject:"Regulatory Framework for Business Transactions", code:"RFBT" },
    { day:"TUE", start:t(13,30), end:t(16,30), student:"Erinn", subject:"Human Behavior in Organizations", code:"PSYC 011" },
    { day:"TUE", start:t(13,30), end:t(16,30), student:"Erich", subject:"Daigdig", code:"GEED 004" },
    { day:"TUE", start:t(18,0), end:t(21,0), student:"Erinn", subject:"Managerial Economics", code:"ECON 351" },
    { day:"TUE", start:t(18,0), end:t(21,0), student:"Erich", subject:"Purposive Communication / Malayuning Komunikasyon", code:"GEED 005" },
    // WED
    { day:"WED", start:t(13,0), end:t(17,0), student:"Erica", subject:"Financial Accounting and Reporting", code:"FAR" },
    // THU
    { day:"THU", start:t(9,0), end:t(11,0), student:"Erinn", subject:"Physical Activity Towards Health and Fitness 1", code:"PATHFIT 1" },
    { day:"THU", start:t(13,0), end:t(17,0), student:"Erica", subject:"Regulatory Framework for Business Transactions", code:"RFBT" },
    { day:"THU", start:t(13,30), end:t(16,30), student:"Erinn", subject:"Financial Accounting and Reporting", code:"ACCO 101" },
    { day:"THU", start:t(16,30), end:t(21,0), student:"Erich", subject:"Psychological Statistics", code:"PSYC 104" },
    // FRI
    { day:"FRI", start:t(8,0), end:t(16,0), student:"Erica", subject:"Auditing", code:"AUD" },
    { day:"FRI", start:t(13,30), end:t(16,30), student:"Erinn", subject:"Understanding the Self / Pag-unawa sa Sarili", code:"GEED 001" },
    { day:"FRI", start:t(15,0), end:t(18,0), student:"Erich", subject:"Understanding the Self / Pag-unawa sa Sarili", code:"GEED 001" },
    { day:"FRI", start:t(16,30), end:t(19,30), student:"Erinn", subject:"Science, Technology and Society / Agham, Teknolohiya, at Lipunan", code:"GEED 007" },
    { day:"FRI", start:t(18,0), end:t(21,0), student:"Erich", subject:"Introduction to Psychology", code:"PSYC 101" },
    // SAT
    { day:"SAT", start:t(13,0), end:t(17,0), student:"Erica", subject:"Financial Accounting and Reporting", code:"FAR" },
    // SUN
    { day:"SUN", start:t(8,0), end:t(12,0), student:"Erinn", subject:"Civic Welfare Training Service 1", code:"CWTS 001" },
    { day:"SUN", start:t(8,0), end:t(12,0), student:"Erich", subject:"Civic Welfare Training Service 1", code:"CWTS 001" },
    { day:"SUN", start:t(13,0), end:t(18,0), student:"Erinn", subject:"Civic Welfare Training Service 1", code:"CWTS 001" },
    { day:"SUN", start:t(13,0), end:t(18,0), student:"Erich", subject:"Civic Welfare Training Service 1", code:"CWTS 001" },
  ];

  function fmt(mins){
    let h = Math.floor(mins/60), m = mins%60;
    const ampm = h >= 12 ? "PM" : "AM";
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    return `${h12}:${m.toString().padStart(2,"0")} ${ampm}`;
  }
  function fmtHour(mins){ // short form for rotated axis: "8", "12", "9"
    let h = Math.floor(mins/60);
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    return String(h12);
  }

  // ---------- LAYOUT (overlap clustering) — orientation-agnostic ----------
  // Given a list of events (all on the same day), assigns ev._col / ev._colCount
  // representing which "lane" each event occupies along the non-time axis.
  function layoutDayEvents(events){
    const sorted = [...events].sort((a,b)=> a.start-b.start || a.end-b.end);
    const clusters = [];
    let current = [];
    let currentMaxEnd = -1;
    for(const ev of sorted){
      if(current.length === 0 || ev.start < currentMaxEnd){
        current.push(ev);
        currentMaxEnd = Math.max(currentMaxEnd, ev.end);
      } else {
        clusters.push(current);
        current = [ev];
        currentMaxEnd = ev.end;
      }
    }
    if(current.length) clusters.push(current);

    for(const cluster of clusters){
      const columns = [];
      for(const ev of cluster){
        let placed = false;
        for(let c=0; c<columns.length; c++){
          if(columns[c] <= ev.start){
            columns[c] = ev.end;
            ev._col = c;
            placed = true;
            break;
          }
        }
        if(!placed){
          ev._col = columns.length;
          columns.push(ev.end);
        }
      }
      const colCount = columns.length;
      for(const ev of cluster) ev._colCount = colCount;
    }
    return sorted;
  }

  // ---------- DOM refs ----------
  const axisTop = document.getElementById("axisTop");
  const axisSide = document.getElementById("axisSide");
  const tracksEl = document.getElementById("tracks");
  const gridWrap = document.getElementById("gridWrap");

  const now = new Date();
  const jsDay = now.getDay();
  const todayCode = Object.keys(JS_DAY_INDEX).find(k => JS_DAY_INDEX[k] === jsDay);

  // ---------- STATE ----------
  let activeStudents = new Set(["Erica","Erinn","Erich"]);
  let orientation = "normal"; // "normal" | "rotated"
  let trackEls = {};          // day -> track element (current orientation)

  // ---------- BUILD (full DOM rebuild for a given orientation) ----------
  function buildGrid(){
    axisTop.innerHTML = "";
    axisSide.innerHTML = "";
    tracksEl.innerHTML = "";
    trackEls = {};

    const rotated = orientation === "rotated";
    axisTop.classList.toggle("rotated", rotated);
    tracksEl.classList.toggle("rotated", rotated);

    if(!rotated){
      // ---- axisTop: day-name header row ----
      DAYS.forEach(d=>{
        const el = document.createElement("div");
        el.className = "axis-top-day" + (d===todayCode ? " is-today" : "");
        el.innerHTML = d + (d===todayCode ? '<span class="today-mark"></span>' : "");
        axisTop.appendChild(el);
      });
      // ---- axisSide: vertical hour rail ----
      const thread = document.createElement("div");
      thread.className = "rail-thread";
      axisSide.appendChild(thread);
      for(let mins=DAY_START; mins<=DAY_END; mins+=60){
        const pct = (mins-DAY_START)/TOTAL_MIN*100;
        const tick = document.createElement("div");
        tick.className = "rail-tick-time";
        tick.style.top = pct + "%";
        tick.innerHTML = `<span class="node"></span>${fmt(mins).replace(":00","")}`;
        axisSide.appendChild(tick);
      }
      // ---- tracks: 7 day columns ----
      DAYS.forEach(d=>{
        const track = document.createElement("div");
        track.className = "track" + (d===todayCode ? " is-today" : "");
        track.dataset.day = d;
        tracksEl.appendChild(track);
        trackEls[d] = track;
      });
    } else {
      // ---- axisTop: hourly time header (absolute ticks) ----
      for(let mins=DAY_START; mins<=DAY_END; mins+=60){
        const pct = (mins-DAY_START)/TOTAL_MIN*100;
        const tick = document.createElement("div");
        tick.className = "axis-top-hour";
        tick.style.left = pct + "%";
        tick.textContent = fmtHour(mins);
        axisTop.appendChild(tick);
      }
      // ---- axisSide: day-name rail (stacked rows) ----
      const thread = document.createElement("div");
      thread.className = "rail-thread horizontal";
      DAYS.forEach(d=>{
        const el = document.createElement("div");
        el.className = "rail-day" + (d===todayCode ? " is-today" : "");
        el.innerHTML = d + (d===todayCode ? '<span class="today-mark"></span>' : "");
        axisSide.appendChild(el);
      });
      // ---- tracks: 7 day rows ----
      DAYS.forEach(d=>{
        const track = document.createElement("div");
        track.className = "track" + (d===todayCode ? " is-today" : "");
        track.dataset.day = d;
        tracksEl.appendChild(track);
        trackEls[d] = track;
      });
    }

    // ---- cards: created once per build, geometry applied by updateLayout() ----
    DAYS.forEach(d=>{
      const dayEvents = EVENTS.filter(e=>e.day===d);
      dayEvents.forEach(ev=>{
        const card = document.createElement("div");
        card.className = "event-card";
        card.dataset.student = ev.student;
        card.innerHTML = `
          <div class="subject">${ev.subject}</div>
          <div class="meta-row">
            <span class="code">${ev.code}</span>
            <span class="student">${ev.student}</span>
          </div>
          <div class="time-range">${fmt(ev.start)} – ${fmt(ev.end)}</div>
        `;
        trackEls[d].appendChild(card);
        ev._el = card;
      });
    });

    // ---- now-line ----
    if(todayCode){
      const nowMin = now.getHours()*60 + now.getMinutes();
      if(nowMin >= DAY_START && nowMin <= DAY_END){
        const pct = (nowMin-DAY_START)/TOTAL_MIN*100;
        const line = document.createElement("div");
        if(!rotated){
          line.className = "now-line vertical";
          line.style.top = pct + "%";
        } else {
          line.className = "now-line horizontal";
          line.style.left = pct + "%";
        }
        trackEls[todayCode].appendChild(line);
      }
    }
  }

  // ---------- LAYOUT: apply geometry to existing cards (no rebuild) ----------
  function updateLayout(){
    const rotated = orientation === "rotated";
    DAYS.forEach(d=>{
      const dayEvents = EVENTS.filter(e=>e.day===d);
      const visible = dayEvents.filter(e=>activeStudents.has(e.student));
      const hidden = dayEvents.filter(e=>!activeStudents.has(e.student));

      const laidOut = layoutDayEvents(visible);
      laidOut.forEach(ev=>{
        const timeStartPct = (ev.start-DAY_START)/TOTAL_MIN*100;
        const timeSpanPct = (ev.end-ev.start)/TOTAL_MIN*100;
        const lanePct = 100/ev._colCount;
        const laneOffsetPct = ev._col * lanePct;
        // The lane (overlap) axis is capped to whatever space actually remains
        // in THIS day's track after the offset — so a wide minimum floor can
        // never push a card past its own day's right/bottom edge. This is what
        // "compress the offset, reduce width, reposition" means in practice.
        const laneSizeExpr = `min(calc(100% - ${laneOffsetPct}% - ${GAP/2}px), max(${MIN_CARD_W}px, calc(${lanePct}% - ${GAP}px)))`;
        const laneSizeExprH = `min(calc(100% - ${laneOffsetPct}% - ${GAP/2}px), max(${MIN_CARD_H}px, calc(${lanePct}% - ${GAP}px)))`;

        if(!rotated){
          // time = vertical, lane (overlap) = horizontal — day boundaries run left/right
          ev._el.style.top = `calc(${timeStartPct}% + ${GAP/2}px)`;
          ev._el.style.minHeight = `max(${MIN_CARD_H}px, calc(${timeSpanPct}% - ${GAP}px))`;
          ev._el.style.height = "auto";
          ev._el.style.left = `calc(${laneOffsetPct}% + ${GAP/2}px)`;
          ev._el.style.width = laneSizeExpr;
          ev._el.style.minWidth = "";
        } else {
          // time = horizontal, lane (overlap) = vertical — day boundaries run top/bottom
          ev._el.style.left = `calc(${timeStartPct}% + ${GAP/2}px)`;
          ev._el.style.minWidth = `max(${MIN_CARD_W}px, calc(${timeSpanPct}% - ${GAP}px))`;
          ev._el.style.width = `max(${MIN_CARD_W}px, calc(${timeSpanPct}% - ${GAP}px))`;
          ev._el.style.top = `calc(${laneOffsetPct}% + ${GAP/2}px)`;
          ev._el.style.height = laneSizeExprH;
          ev._el.style.minHeight = "";
        }
        ev._el.style.zIndex = Math.round(1 + ev._col);
        ev._el.classList.remove("dimmed");
        ev._el.style.pointerEvents = "";
      });

      hidden.forEach(ev=>{
        ev._el.classList.add("dimmed");
        ev._el.style.pointerEvents = "none";
      });
    });
  }

  // ---------- ORCHESTRATION ----------
  // Orientation is controlled entirely by the user via the flip button — it is
  // never inferred from viewport size or content pressure. Responsive scaling
  // (font/padding shrink at small card sizes) is handled separately by the
  // CSS container queries on .event-card.
  function renderAll({ animateOrientation = false } = {}){
    if(animateOrientation){
      gridWrap.classList.add("switching");
      window.setTimeout(()=>{
        buildGrid();
        updateLayout();
        requestAnimationFrame(()=>{ gridWrap.classList.remove("switching"); });
      }, 220);
    } else {
      buildGrid();
      updateLayout();
    }
  }

  // initial build — always starts in the traditional "days across the top,
  // time down the side" view, with no animation on first paint.
  orientation = "normal";
  buildGrid();
  updateLayout();

  // ---------- clock ----------
  const clockEl = document.getElementById("clock");
  function updateClock(){
    const d = new Date();
    clockEl.innerHTML = `<span>${d.toLocaleDateString(undefined,{month:'short', day:'numeric'})}</span> · ${d.toLocaleTimeString(undefined,{hour:'2-digit', minute:'2-digit'})}`;
  }
  updateClock();
  setInterval(updateClock, 30000);

  // ---------- NOW PLAYING (single source of truth: EVENTS) ----------
  const DAY_FULL = {MON:"Monday",TUE:"Tuesday",WED:"Wednesday",THU:"Thursday",FRI:"Friday",SAT:"Saturday",SUN:"Sunday"};
  const npLabelEl = document.getElementById("npLabel");
  const npContentEl = document.getElementById("npContent");

  function dayCodeFromDate(d){
    const idx = d.getDay();
    return Object.keys(JS_DAY_INDEX).find(k => JS_DAY_INDEX[k] === idx);
  }
  function formatDur(mins){
    mins = Math.max(0, Math.round(mins));
    const h = Math.floor(mins/60), m = mins%60;
    if(h<=0) return `${m} min`;
    if(m===0) return `${h}h`;
    return `${h}h ${m}m`;
  }
  function studentTag(student){
    return `<span class="np-who" data-student="${student}"><span class="dot"></span>${student}</span>`;
  }

  // Reads directly from EVENTS — the exact data the grid renders from —
  // so the header can never drift out of sync with the timetable.
  function computeNowPlayingState(){
    const d = new Date();
    const code = dayCodeFromDate(d);
    const mins = d.getHours()*60 + d.getMinutes();

    const todays = EVENTS.filter(e=>e.day===code).sort((a,b)=>a.start-b.start);
    const active = todays.filter(e=> mins>=e.start && mins<e.end);

    if(active.length > 1){
      return { mode:"multi", key:"multi:"+active.map(e=>e.day+e.start+e.student).join(","), events:active };
    }
    if(active.length === 1){
      const e = active[0];
      return { mode:"single", key:"single:"+e.day+e.start+e.student, event:e, now:mins };
    }
    const upcomingToday = todays.filter(e=> e.start > mins).sort((a,b)=>a.start-b.start)[0];
    if(upcomingToday){
      return { mode:"upnext", key:"upnext:"+upcomingToday.day+upcomingToday.start+upcomingToday.student, event:upcomingToday, now:mins };
    }
    const todayIdx = DAYS.indexOf(code);
    for(let offset=1; offset<=7; offset++){
      const dcode = DAYS[(todayIdx+offset) % 7];
      const dayEvents = EVENTS.filter(e=>e.day===dcode).sort((a,b)=>a.start-b.start);
      if(dayEvents.length){
        return { mode:"daycomplete", key:"daycomplete:"+dcode+dayEvents[0].start+dayEvents[0].student, event:dayEvents[0] };
      }
    }
    return { mode:"none", key:"none" };
  }

  function renderNowPlayingContent(state){
    if(state.mode === "multi"){
      npLabelEl.textContent = "NOW PLAYING";
      npContentEl.innerHTML = state.events.map(e => `
        <div class="np-multi-row">
          <span class="np-multi-subject">${e.subject}</span>
          ${studentTag(e.student)}
        </div>`).join("");
      return;
    }
    if(state.mode === "single"){
      npLabelEl.textContent = "NOW";
      const e = state.event;
      const pct = Math.min(100, Math.max(0, (state.now-e.start)/(e.end-e.start)*100));
      npContentEl.innerHTML = `
        <div class="np-title-row">
          <span class="np-subject">${e.subject}</span>
          ${studentTag(e.student)}
        </div>
        <div class="np-meta">${e.code} · ${DAY_FULL[e.day]} · ${fmt(e.start)} – ${fmt(e.end)}</div>
        <div class="np-progress-row" style="--np-color:var(--${e.student.toLowerCase()})">
          <div class="np-track"><div class="np-fill" style="width:${pct}%"></div></div>
          <div class="np-timing-row"><span>${fmt(e.start)}</span><span>${formatDur(e.end-state.now)} remaining</span></div>
        </div>`;
      return;
    }
    if(state.mode === "upnext"){
      npLabelEl.textContent = "UP NEXT";
      const e = state.event;
      npContentEl.innerHTML = `
        <div class="np-title-row">
          <span class="np-subject">${e.subject}</span>
          ${studentTag(e.student)}
        </div>
        <div class="np-meta">${e.code} · Today · ${fmt(e.start)} – ${fmt(e.end)}</div>
        <div class="np-meta">Starts in ${formatDur(e.start-state.now)}</div>`;
      return;
    }
    if(state.mode === "daycomplete"){
      npLabelEl.textContent = "DAY COMPLETE";
      const e = state.event;
      npContentEl.innerHTML = `
        <div class="np-title-row">
          <span class="np-subject">${e.subject}</span>
          ${studentTag(e.student)}
        </div>
        <div class="np-meta">${e.code} · ${DAY_FULL[e.day]} · ${fmt(e.start)} – ${fmt(e.end)}</div>`;
      return;
    }
    npLabelEl.textContent = "SCHEDULE";
    npContentEl.innerHTML = `<div class="np-meta">No classes scheduled.</div>`;
  }

  let npCurrentKey = null;
  function updateNowPlaying(){
    const state = computeNowPlayingState();
    if(state.key !== npCurrentKey){
      // the active class (or state) itself changed — cross-fade like a track change
      npCurrentKey = state.key;
      npContentEl.classList.add("switching");
      window.setTimeout(()=>{
        renderNowPlayingContent(state);
        requestAnimationFrame(()=> npContentEl.classList.remove("switching"));
      }, 220);
    } else if(state.mode === "single"){
      // same class still running — just advance the progress bar / remaining time, no transition
      const e = state.event;
      const pct = Math.min(100, Math.max(0, (state.now-e.start)/(e.end-e.start)*100));
      const fillEl = npContentEl.querySelector(".np-fill");
      const remainEl = npContentEl.querySelector(".np-timing-row span:last-child");
      if(fillEl) fillEl.style.width = pct + "%";
      if(remainEl) remainEl.textContent = formatDur(e.end-state.now) + " remaining";
    } else if(state.mode === "upnext"){
      const e = state.event;
      const metas = npContentEl.querySelectorAll(".np-meta");
      if(metas[1]) metas[1].textContent = `Starts in ${formatDur(e.start-state.now)}`;
    }
  }

  updateNowPlaying();
  setInterval(updateNowPlaying, 15000); // smooth-enough live progress without a per-second re-render

  // ---------- legend filters ----------
  const legendItems = document.querySelectorAll(".legend-item");

  function applyFilter(){
    legendItems.forEach(item=>{
      const s = item.dataset.student;
      item.classList.toggle("active", activeStudents.has(s));
      item.classList.toggle("dimmed", !activeStudents.has(s));
    });
    // recompute widths/positions for the current orientation only —
    // filtering never changes which axis represents time vs. days
    updateLayout();
  }

  legendItems.forEach(item=>{
    item.addEventListener("click", ()=>{
      const s = item.dataset.student;
      const allActive = activeStudents.size === 3;
      if(allActive){
        activeStudents = new Set([s]);
      } else if(activeStudents.has(s) && activeStudents.size===1){
        activeStudents = new Set(["Erica","Erinn","Erich"]);
      } else if(activeStudents.has(s)){
        activeStudents.delete(s);
        if(activeStudents.size===0) activeStudents = new Set(["Erica","Erinn","Erich"]);
      } else {
        activeStudents.add(s);
      }
      applyFilter();
    });
  });

  // ---------- flip-axis control (manual only) ----------
  const flipBtn = document.getElementById("flipBtn");
  const flipBtnLabel = document.getElementById("flipBtnLabel");

  function updateFlipButton(){
    const rotated = orientation === "rotated";
    flipBtn.classList.toggle("rotated", rotated);
    // label always names the axis layout you'll get by pressing again
    flipBtnLabel.textContent = rotated ? "Time → Days" : "Days → Time";
    flipBtn.setAttribute("aria-pressed", rotated ? "true" : "false");
  }
  updateFlipButton();

  flipBtn.addEventListener("click", ()=>{
    orientation = orientation === "normal" ? "rotated" : "normal";
    updateFlipButton();
    renderAll({ animateOrientation:true });
  });
</script>

</body>
</html>
